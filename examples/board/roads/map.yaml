board:
  default: grass
  legend:
    ".": grass
    "^": hill
    "T": forest
    "~": water
    "f": ford
  # a river runs down the valley, an old bridge over it in the middle and a ford below; the west
  # village stands on a terrace under a wooded hill, the east one on the plain at the end of the
  # road from the bridge; a low swell rises in the south-east under a wood; an old tunnel runs
  # under the hill from a level cut either side of it
  cells: |
    ..T^^^T....~~......T.TTT
    ..T^^^^T...~~......TT.TT
    ..T^^^^T...~~.......TT.T
    ..T^^^T....~~........TT.
    ...TTTT....~~...........
    ...........~~...........
    ...........~~...........
    ...........~~...........
    ...........~~...........
    ...........~~...........
    ...........~~....TTT.TT.
    ...........~~....TTTT.T.
    ...........ff...T.TTTT..
    ...........~~....T.TTTT.
    ...........~~....TT.TTT.
    ...........~~......T.TT.
