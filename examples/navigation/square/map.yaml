board:
  default: grass
  legend:
    ".": grass
    "#": wall
    "T": forest
    "^": hill
    "=": road
    "~": water
    "f": ford
  # a hill in the first unit's way: its cone climbs the slope and stops, the hawk's passes over;
  # a river two cells beyond the wall's gap, a bridge over it too narrow for the wagon, a rope
  # bridge too weak for it and a ford at its foot; above the gap a hole in the wall and a ford,
  # both two cells wide: the giant's one way over
