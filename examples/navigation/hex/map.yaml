board:
  default: grass
  legend:
    ".": grass
    "#": wall
    "T": forest
    "^": hill
    "=": road
    "~": water
    "f": ford
  # a hill in the first unit's way: its cone climbs the slope and stops, the hawk's passes over;
  # a river three hexes beyond the wall's gap, a bridge over it too narrow for the wagon, a rope
  # bridge too weak for it and a ford at its foot; above the gap a hole in the wall and a ford,
  # both three hexes wide: the giant's one way over
  cells: |
    . . = = = = = = = = = = = = ~ = = = . .
     . . = . . . . . . . # . . . ~ . . = . .
      . . = . . . . . ^ ^ . . . . f . . = . .
       . . = . . . . . ^ ^ . . . . f . . = . .
        . . = . . T T T ^ ^ . . . . f . . = . .
         . . = . . T T T . . # . . . ~ . . = . .
          . . = . . T T T . . . . . . ~ . . = . .
           . . = . . . . . . . # . . . ~ . . = . .
            . . = . . . . . . . # . . . ~ T T = . .
             . . = . . . . . . . # . . . ~ T T = . .
              . . = . . . . . . . # . . . ~ T T = . .
               . . = . . . . . . . # . . . f . . = . .
  entities:
    - {kind: bridge, from: [13, 6], to: [15, 6]}
    - {kind: rope, from: [13, 8], to: [15, 8]}
