# Madeira: 64 x 32 km in 640 x 320 cells of 100 m, the island whole.
area:
  centre: [-16.96, 32.745] # longitude, latitude
  cells: [640, 320]
  cell: 100 # metres
  units: 32
  figures: 15 # times bigger than life the demos draw their figures: a man, a deck, a tunnel
  sea: 10 # cells of sea round the land at least: the area grows where it has fewer
kinds: {built: built} # the settlements' cells, drawn "@"
ground:
  rock: {slope: 0.9, above: 1600}
  sand: {within: 2, below: 20, share: 0.3}
  forest: {from: 300, to: 1400, share: 0.45}
cover: # with relief: what grows where, by the land cover; a flat map lays its forest by noise
  source: corine
  kinds: # by CORINE Land Cover's classes
    woodland: [311, 313, 324] # broad-leaved, mixed, transitional
    pinewood: [312]
    heath: [322]
    farmland: [221, 222, 242, 243] # vineyards, fruit, complex cultivation
  sites: # within a Natura 2000 site the kinds named are another
    - {site: PTMAD0001, of: [woodland], kind: laurisilva} # Laurissilva da Madeira
rivers:
  brook: 6 # km² drained
  stream: 15
  river: 40
  depth: [2, 4, 6] # metres
  rain: 1000
  width: 0.42
  meander: 15
  ford: {every: 24, slope: 0.1}
roads:
  width: 7
  deck: 12
  thickness: 0.2 # metres of a deck in life
  cut: 200 # metres a corner is dug down at most, a bridge's head too
  fill: 200 # metres a corner is raised at most
  route: {cut: 40, fill: 40} # metres a route's step is forgiven at most: none tried first
  metre: 1 # a metre of road's price
  cubic: 0.001 # a cubic metre of earth's: a bridge's heads levelled against the way round
  climb: 6
  rock: 4
  bridge: 4
  longest: 6 # cells a bridge spans, at most
  high: 200
  figure: 1.8 # metres of a man in life
  # with relief the roads are OpenStreetMap's, followed leg by leg; a flat map plans its own
  # along the routes below
  source: osm
  classes: [motorway, trunk, primary, secondary, tertiary]
  places: # longitude, latitude and a size of the settlements'; a bare pair: the default size
    Funchal: {at: [-16.9086, 32.6496], size: town}
    Câmara de Lobos: {at: [-16.977, 32.65], size: town}
    Ribeira Brava: {at: [-17.0636, 32.6739], size: town}
    Ponta do Sol: {at: [-17.1, 32.681], size: hamlet}
    Calheta: [-17.1736, 32.7225]
    Prazeres: {at: [-17.205, 32.756], size: hamlet}
    Porto Moniz: [-17.169, 32.867]
    Seixal: {at: [-17.102, 32.824], size: hamlet}
    São Vicente: [-17.043, 32.799]
    Ponta Delgada: {at: [-16.99, 32.825], size: hamlet}
    Santana: [-16.881, 32.806]
    Faial: {at: [-16.857, 32.783], size: hamlet}
    Machico: {at: [-16.767, 32.718], size: town}
    Santa Cruz: {at: [-16.792, 32.688], size: town}
    Caniço: {at: [-16.848, 32.652], size: town}
    Encumeada: {at: [-17.019, 32.755], size: none}
    Poiso: {at: [-16.888, 32.712], size: none}
  routes:
    - [Funchal, Câmara de Lobos, Ribeira Brava, Ponta do Sol, Calheta]
    - [Calheta, Prazeres, Porto Moniz]
    - [Porto Moniz, Seixal, São Vicente, Ponta Delgada, Santana, Faial]
    - [Faial, Machico, Santa Cruz, Caniço, Funchal]
    - [Ribeira Brava, Encumeada, São Vicente]
    - [Funchal, Poiso, Faial]
fields: # a field over the cells of a kind in each block of 16 cells a side, a sector of the world
  - {cells: forest, kind: forest, grain: 16, least: 4}
  - cells: [laurisilva, woodland, pinewood, heath, farmland] # what the land cover lays
    kind: growth
    grain: 16
    least: 4
  - {cells: built, kind: settlement, grain: 16, least: 1}
tunnels: # OpenStreetMap's, where the ground lets one lie
  clear: 2.2 # metres of its room in life
  width: 4 # metres in life
  cover: 5 # metres of rock over its roof
  grade: 0.1 # rise over run
  longest: 40 # cells
  reshape: 60 # metres a head is cut into the ground and its headwall raised, at most
settlements:
  source: osm # with relief: the cells OpenStreetMap has least buildings on or more
  least: 8
  cells: built # the cell kind laid, round a place on a flat map
  sizes: {hamlet: 3, village: 8, town: 16} # cells
  default: village
flat: # the simple map's own: cells of 50, roads two figures of 20 wide, a deck with its railings
  units: 50
  road: 44
  deck: 48
  longest: 1
