name: Go Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # as the Makefile: aabbworld's pair sweep four boxes at a time where the CPU has AVX2
    env:
      GOEXPERIMENT: simd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: true

      - name: Install Ebitengine system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev libasound2-dev libx11-dev pkg-config xvfb

      - name: Install dependencies
        run: go mod download

      - name: Run Tests with Coverage
        run: xvfb-run -a go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: kjkrol/gram
